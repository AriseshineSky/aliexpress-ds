# Authoritative daily_limit / pacing: Redis aliexpress:oauth:apps
#   (uv run aliexpress-ds app-limits-set -k APP_KEY -d N).
# Pace = min(86400/daily_limit, 1s) when min_interval_sec unset; no daily_limit → 1s.
# Rate counters stay per-VPS in data/rate_limit_state.json (not shared).
# Secrets stay only on each VPS .env / Redis — never put app_secret / tokens here.

